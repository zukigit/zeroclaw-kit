# Runtime profile: how an agent runs (limits, context handling, thinking).
# The profile's name is its folder's name. `[runtime_profile]` becomes
# `[runtime_profiles.<name>]` in ZeroClaw's config.toml. Agents select it
# with `runtime_profile = "<name>"`. Values below are ZeroClaw's defaults.

[runtime_profile]
agentic = false
deferred_builtin_tools = false
max_actions_per_hour = 20
max_cost_per_day_cents = 500
max_delegation_depth = 0
max_tool_iterations = 0
shell_timeout_secs = 60
strict_tool_parsing = false

[runtime_profile.context_compression]
enabled = false
identifier_policy = "strict"
max_passes = 3
protect_first_n = 3
protect_last_n = 4
source_max_chars = 50000
summary_max_chars = 4000
threshold_ratio = 0.5
timeout_secs = 60
tool_result_retrim_chars = 2000

[runtime_profile.eval]
enabled = false
max_retries = 1
min_quality_score = 0.5

[runtime_profile.history_pruning]
collapse_tool_results = true
enabled = false
keep_recent = 4
max_tokens = 8192

[runtime_profile.thinking]
default_level = "medium"
display = "off"
native_thinking = false

[runtime_profile.tool_receipts]
enabled = false
inject_system_prompt = true
show_in_response = false
